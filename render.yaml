# ===================================================================================
# Render Cloud Deployment Blueprint (1-Click Deploy)
# ===================================================================================
services:
  # Python Flask Backend Service
  - type: web
    name: cyber-soc-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 3 --timeout 120 app:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: API_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: cyber-soc-postgres
          property: connectionString

# Cloud Managed PostgreSQL Database
databases:
  - name: cyber-soc-postgres
    databaseName: cyber_threat_db
    user: soc_admin
    plan: free
